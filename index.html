<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Stock Impressora 3D</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="top-bar">
  <h1>📦 Stock Impressora 3D</h1>

  <input type="text" id="search" placeholder="Pesquisar material...">

  <a href="./history.html">📜 Histórico</a>

  <input type="file" id="excelInput" accept=".xlsx,.csv" hidden>
  <button id="importBtn">📥 Importar Excel</button>
  <button id="exportBtn">📤 Exportar Excel</button>

  <button id="addItemBtn">➕ Novo Artigo</button>

  <button id="darkBtn">🌙 / ☀️</button>

  <img src="./logo.png" alt="Logo" class="logo">
</header>

<main>
  <table id="stockTable">
    <thead>
      <tr>
        <th>IDF</th>
        <th>Quantidade</th>
        <th>Material</th>
        <th>Descrição</th>
        <th>Marca</th>
        <th>Link</th>
        <th>Notas</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<!-- =====================
     MODAL: NOVO ARTIGO
===================== -->
<div id="addModal" class="modal hidden">
  <div class="modal-content">

    <h2>➕ Novo Artigo</h2>

    <input type="text" id="newIdf" placeholder="IDF">

    <input type="number" id="newQuantidade" placeholder="Quantidade" min="0">
    <input type="text" id="newMaterial" placeholder="Material">
    <input type="text" id="newDescricao" placeholder="Descrição">
    <input type="text" id="newMarca" placeholder="Marca">
    <input type="text" id="newLink" placeholder="Link">
    <input type="text" id="newNotas" placeholder="Notas">

    <div class="modal-actions">
      <button id="saveNewItemBtn">Guardar</button>
      <button onclick="closeAddModal()">Cancelar</button>
    </div>

  </div>
</div>

<script src="./xlsx.full.min.js"></script>
<script src="./app.js"></script>

</body>
</html>
